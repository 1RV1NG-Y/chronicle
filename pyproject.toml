[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronicle-day-tracker"
version = "0.1.0"
description = "A local-first chronological viewer for ActivityWatch data"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.scripts]
chronicle = "chronicle.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicle"]
